version: 2

sources:
  - name: engine_raw
    description: >
      Landing tables in ClickHouse. The raw_* CDC tables hold the Debezium CDC images of the
      PostgreSQL operational tables, written by the Spark streaming job (Path B). Every one of
      them carries the CDC metadata columns cdc_op, cdc_lsn, cdc_source_ts, cdc_emitted_ts,
      is_deleted, kafka_partition, kafka_offset and the server-assigned ingested_at.
      raw_engine_hf_features and hf_ingest_batches are written by the same job from the Avro
      high-frequency (HF) sensor frames (CONTRACT_V2.md); they carry no CDC metadata.
      gold_engine_rul_predictions is written by data_science/predict_rul.py.
    schema: "{{ env_var('CLICKHOUSE_DB', 'iot_engine') }}"
    loader: spark-structured-streaming
    tables:
      - name: raw_engine_telemetry
        description: >
          One row per CDC event of engine_telemetry (ReplacingMergeTree(cdc_lsn) ordered by
          engine_id, telemetry_id). Several versions per telemetry_id exist until merged: the
          highest cdc_lsn is the current one; is_deleted = 1 marks a delete (values from `before`).
        config:
          loaded_at_field: ingested_at
          freshness:
            warn_after: {count: 10, period: minute}
            error_after: {count: 60, period: minute}
        columns:
          - name: telemetry_id
            description: Primary key of the source pulse (BIGSERIAL).
          - name: engine_id
            description: Engine identifier, e.g. CFM56-104.
          - name: lifecycle_id
            description: Run-to-failure lifecycle of the engine (increments after each repair).
          - name: cycle_number
            description: Operating cycle within the lifecycle (one cycle = SIM_PULSES_PER_CYCLE pulses).
          - name: event_ts
            description: Measurement time of the pulse (UTC); differs from created_ts for back-filled history.
          - name: rpm
            description: Shaft speed (rev/min).
          - name: core_temp_c
            description: Core temperature (degC).
          - name: egt_c
            description: Exhaust gas temperature (degC).
          - name: vibration_mm_s
            description: Vibration velocity (mm/s).
          - name: fuel_flow_kg_h
            description: Fuel flow (kg/h).
          - name: oil_pressure_psi
            description: Oil pressure (psi).
          - name: wear_factor
            description: Simulator ground-truth wear w(t) in 0..1. Never an ML feature.
          - name: status
            description: HEALTHY | WARNING | CRITICAL | FAILURE (derived from wear; never an ML feature).
          - name: maintenance_id
            description: Work order back-filled by an UPDATE at failure on WARNING/CRITICAL/FAILURE rows.
          - name: created_ts
            description: Insert time in PostgreSQL.
          - name: cdc_op
            description: Debezium operation (c insert, u update, d delete, r snapshot read).
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['c', 'u', 'd', 'r']
                  config:
                    severity: warn
          - name: cdc_lsn
            description: PostgreSQL log sequence number of the change (0 when absent); orders row versions.
          - name: is_deleted
            description: 1 when the event is a delete.
          - name: ingested_at
            description: Server time the row landed in ClickHouse; drives incremental watermarks.
        data_tests:
          - finite_values:
              arguments:
                columns: ['rpm', 'core_temp_c', 'egt_c', 'vibration_mm_s', 'fuel_flow_kg_h', 'oil_pressure_psi']
              config:
                severity: warn

      - name: raw_engine_status_registry
        description: >
          Full change history of engine_status_registry (ReplacingMergeTree ordered by engine_id,
          cdc_lsn: replays collapse, every real change is kept).
        columns:
          - name: engine_id
            description: Engine identifier.
          - name: engine_model
            description: Engine model, e.g. CFM56-7B (categorical ML feature).
          - name: operational_status
            description: HEALTHY | WARNING | CRITICAL | FAILURE | MAINTENANCE_RESET.
          - name: current_lifecycle_id
            description: Lifecycle the engine is currently in.
          - name: current_cycle
            description: Current cycle within that lifecycle.
          - name: cycles_since_new
            description: Cycles accumulated since the engine was registered.
          - name: lifecycles_completed
            description: Number of run-to-failure lifecycles completed.
          - name: last_maintenance_ts
            description: Completion time of the most recent repair.
          - name: status_changed_ts
            description: Time operational_status last changed.
          - name: cdc_lsn
            description: Log sequence number of the change; the highest one is the current state.
          - name: ingested_at
            description: Server time the row landed in ClickHouse.

      - name: raw_maintenance_log
        description: >
          CDC images of maintenance_log (ReplacingMergeTree(cdc_lsn) ordered by engine_id,
          maintenance_id). A work order is inserted OPEN at failure (op c) and updated to COMPLETED
          after the repair (op u).
        columns:
          - name: maintenance_id
            description: Work order id (BIGSERIAL); unique per engine lifecycle.
          - name: lifecycle_id
            description: Lifecycle that ended in this failure.
          - name: failure_cycle
            description: Cycle at which the engine failed.
          - name: failure_mode
            description: HPT_BLADE_EROSION | BEARING_DEGRADATION | OIL_SYSTEM_LEAK | COMPRESSOR_FOULING.
          - name: maintenance_status
            description: OPEN | COMPLETED.
          - name: cdc_lsn
            description: Log sequence number of the change; the highest one is the current version.
          - name: ingested_at
            description: Server time the row landed in ClickHouse.

      - name: gold_engine_rul_predictions
        description: >
          Remaining-useful-life predictions appended by data_science/predict_rul.py (MergeTree, one
          row per scoring of an engine). May be empty before the first model is promoted.
        columns:
          - name: predicted_at
            description: Scoring time (UTC).
          - name: engine_id
            description: Scored engine.
          - name: lifecycle_id
            description: Lifecycle of the scored feature row.
          - name: predicted_rul_cycles
            description: Predicted remaining cycles until failure.
          - name: predicted_rul_hours
            description: predicted_rul_cycles converted with FLIGHT_HOURS_PER_CYCLE.
          - name: failure_probability
            description: Probability of failure within the horizon (0..1).
            data_tests:
              - accepted_range:
                  arguments:
                    min_value: 0
                    max_value: 1
                  config:
                    severity: warn
          - name: risk_band
            description: LOW | MEDIUM | HIGH.
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['LOW', 'MEDIUM', 'HIGH']
                  config:
                    severity: warn
          - name: model_version
            description: rul-YYYYMMDDTHHMMSSZ of the model that produced the prediction.

      - name: raw_engine_hf_features
        description: >
          One row per high-frequency (HF) sensor frame: the Spark job decodes the Avro frame
          (kHz vibration waveforms plus redundant A/B process channels of one tick) and keeps
          only its features (ReplacingMergeTree(ingested_at) ordered by engine_id, telemetry_id:
          a merge keeps the copy with the newest ingested_at, on a tie the one inserted last; TTL
          90 days on frame_start_ts; a table created before the version column keeps its engine,
          which is harmless because staging elects copies by ingested_at itself).
          Delivery is at least once and best effort: a frame can land more than once, late, or
          never. The raw frames live in the bronze lake only.
        config:
          loaded_at_field: ingested_at
          freshness:
            # warn only: the HF path is best effort, the 1 Hz CDC path is the system of record
            warn_after: {count: 10, period: minute}
        columns:
          - name: engine_id
            description: Engine identifier; also the Kafka message key.
          - name: engine_model
            description: Engine type as sent by the edge gateway, e.g. CFM56-7B.
          - name: lifecycle_id
            description: Lifecycle of the frame (same as its pulse).
          - name: cycle_number
            description: Operating cycle within the lifecycle (same as its pulse).
          - name: telemetry_id
            description: engine_telemetry.telemetry_id of the 1 Hz pulse of the same tick; the join key.
          - name: frame_seq
            description: Per-engine 1-based frame ordinal (count of the engine's pulses); gaps are lost frames.
          - name: frame_start_ts
            description: Frame start (UTC); equals event_ts of the pulse of the same tick.
          - name: frame_duration_ms
            description: Frame period (SIM_HF_FRAME_MS).
          - name: n1_rpm
            description: Fan (low-pressure) spool speed during the frame.
          - name: n2_rpm
            description: Core (high-pressure) spool speed during the frame.
          - name: bpfo_order
            description: Fan bearing outer-race defect frequency as a multiple of the N1 shaft frequency.
          - name: vibration_sample_rate_hz
            description: Sample rate of the vibration channels (SIM_HF_SAMPLE_RATE_HZ).
          - name: vibration_channels
            description: Vibration channels in the frame (fan_frame_vel and core_trf_vel first).
          - name: process_channels
            description: Process channels in the frame (redundant A/B sensors).
          - name: fan_rms
            description: >
              RMS of the fan frame velocity waveform (mm/s); equals the pulse's vibration_mm_s.
              The fan_* and core_* (turbine rear frame) features share one definition per suffix.
          - name: fan_peak
            description: Peak absolute velocity (mm/s).
          - name: fan_crest_factor
            description: Peak / RMS (dimensionless; a pure tone is 1.41, impacts raise it).
          - name: fan_kurtosis
            description: Pearson kurtosis of the waveform (Gaussian noise 3, impulsive > 3).
          - name: fan_amp_1x_n1
            description: Hann-windowed spectral amplitude at the N1 shaft frequency (mm/s; fan unbalance).
          - name: fan_amp_1x_n2
            description: Spectral amplitude at the N2 shaft frequency (mm/s; core unbalance).
          - name: fan_amp_bpfo
            description: Peak spectral amplitude within 3 % of bpfo_order x N1 frequency (mm/s; bearing defect).
          - name: fan_band_energy_hf
            description: Fraction of the spectral energy above a quarter of the sample rate (0..1).
          - name: fan_spectral_centroid_hz
            description: Energy-weighted mean frequency of the spectrum (Hz).
          - name: egt_ab_split
            description: Mean absolute difference of the redundant EGT sensors A and B over the frame (degC).
          - name: process_means
            description: >
              Mean of every process channel over the frame, by parameter name with sensor suffix
              (e.g. OIL_T_A degC, OIL_QTY_A L, OIL_DP_A psid, EGT_B degC, N1_A rpm).
          - name: frame_bytes
            description: Size of the Avro frame on the wire (bytes).
          - name: kafka_partition
            description: Kafka partition of the frame (engine_hf.sensor_frames).
          - name: kafka_offset
            description: Kafka offset of the frame; with the partition it orders copies that landed together.
          - name: ingested_at
            description: Server time the row landed in ClickHouse; the newest copy of a frame wins.
        data_tests:
          - finite_values:
              arguments:
                columns:
                  - fan_rms
                  - fan_peak
                  - fan_crest_factor
                  - fan_kurtosis
                  - fan_amp_1x_n1
                  - fan_amp_1x_n2
                  - fan_amp_bpfo
                  - fan_band_energy_hf
                  - fan_spectral_centroid_hz
                  - core_rms
                  - core_peak
                  - core_crest_factor
                  - core_kurtosis
                  - core_amp_1x_n1
                  - core_amp_1x_n2
                  - core_amp_bpfo
                  - core_band_energy_hf
                  - core_spectral_centroid_hz
                  - egt_ab_split
              config:
                # stg_engine_hf_features turns such values into NULL; this reports the producer
                severity: warn
          - expression_is_true:
              name: raw_engine_hf_features_amplitudes_non_negative
              arguments:
                expression: >
                  not (fan_rms < 0 or fan_peak < 0 or fan_amp_bpfo < 0 or fan_amp_1x_n1 < 0
                  or core_rms < 0 or core_peak < 0 or core_amp_1x_n2 < 0 or egt_ab_split < 0)
              config:
                severity: warn

      - name: hf_ingest_batches
        description: >
          One row per HF micro-batch the Spark job wrote to raw_engine_hf_features (MergeTree,
          TTL 30 days): throughput and latency of the HF path for dashboards. Not read by any
          model; documented as part of the HF landing zone.
        columns:
          - name: batch_id
            description: Spark micro-batch id of the clickhouse_hf_features query.
          - name: batch_started_at
            description: Time the batch started (UTC).
          - name: frames
            description: Frames written by the batch.
          - name: bytes
            description: Frame bytes the batch processed.
          - name: engines
            description: Distinct engines in the batch.
          - name: min_frame_ts
            description: Oldest frame_start_ts of the batch.
          - name: max_frame_ts
            description: Newest frame_start_ts of the batch; ingested_at minus it is the HF path latency.
          - name: duration_ms
            description: Processing time of the batch (ms).
          - name: ingested_at
            description: Server time the batch row landed in ClickHouse.
