# Dependabot version updates: one weekly batch per ecosystem, grouped so that a week brings a
# handful of pull requests, each checked by .github/workflows/ci.yml (image builds, unit tests,
# dbt integration). New releases wait out a 7-day cooldown before they are proposed.
version: 2

updates:
  # Actions used by the workflows (pinned to major tags).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  # Python pins of the three images: minor and patch updates in one pull request per directory,
  # major updates in another. dbt-core and dbt-clickhouse are also pinned in
  # tests/analytics/run_dbt_integration.sh: bump them there in the same pull request.
  - package-ecosystem: pip
    directories:
      - /simulator
      - /streaming
      - /data_science
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(deps)
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      python-major:
        patterns: ["*"]
        update-types: [major]
    ignore:
      # pyspark (and py4j, which it pins) moves together with the SHA-256 verified pyspark sdist
      # and the Spark connector jars in streaming/Dockerfile: upgrade them together, by hand.
      - dependency-name: pyspark
      - dependency-name: py4j

  # Base images of the three Dockerfiles.
  - package-ecosystem: docker
    directories:
      - /simulator
      - /streaming
      - /data_science
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(docker)
    groups:
      docker-base-images:
        patterns: ["*"]
