# Dependabot version updates: one weekly batch per ecosystem, grouped so that a week brings a
# handful of pull requests, each checked by .github/workflows/ci.yml (image builds, unit tests,
# dbt integration). New releases wait out a 7-day cooldown before they are proposed.
version: 2

updates:
  # Actions used by the workflows (pinned to major tags).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  # Python pins of the simulator and data-platform images: minor and patch updates in one
  # pull request per directory, major updates in another. dbt-core and dbt-clickhouse are
  # also pinned in tests/analytics/run_dbt_integration.sh: bump them there in the same PR.
  # Streaming is a separate entry below: PySpark 3.5 cannot take pandas 3 / numpy 2.
  - package-ecosystem: pip
    directories:
      - /simulator
      - /data_science
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(deps)
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      python-major:
        patterns: ["*"]
        update-types: [major]

  # Streaming image is CPython 3.11 + PySpark 3.5: pandas 3, numpy 2 and the pyarrow line
  # that follows them are not supported (streaming/requirements.txt). Keep majors out of
  # this directory so the weekly python-major group cannot open a breaking bump here.
  - package-ecosystem: pip
    directory: /streaming
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(deps)
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: pyspark
      - dependency-name: py4j
      - dependency-name: pandas
        update-types: ["version-update:semver-major"]
      - dependency-name: numpy
        update-types: ["version-update:semver-major"]
      - dependency-name: pyarrow
        update-types: ["version-update:semver-major"]
      - dependency-name: python-dateutil
        update-types: ["version-update:semver-major"]

  # Base images of the three Dockerfiles.
  - package-ecosystem: docker
    directories:
      - /simulator
      - /streaming
      - /data_science
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(docker)
    groups:
      docker-base-images:
        patterns: ["*"]
