[project]
name = "iot-engine-data"
version = "1.0.0"
description = "IoT jet engine telemetry lakehouse and predictive maintenance platform"
requires-python = ">=3.11"
license = "MIT"
keywords = [
    "iot",
    "jet-engine",
    "telemetry",
    "lakehouse",
    "predictive-maintenance",
    "remaining-useful-life",
    "spark-streaming",
    "clickhouse",
    "dbt",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["analytics/target", "analytics/dbt_packages"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N803"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["simulator", "streaming", "data_science", "orchestration"]
addopts = "-q --import-mode=importlib"
